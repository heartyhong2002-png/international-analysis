# ==============================================================================
# Apache Airflow 2.10.2 — local orchestration for international-analysis
#
# Secrets are NEVER committed. Airflow services require a local env file:
#   cp .env.airflow.example .env.airflow   # then edit secrets (gitignored)
#   docker compose --env-file .env.airflow up airflow-init
#   docker compose --env-file .env.airflow up -d
#
# --env-file supplies Compose interpolation (POSTGRES_*, Fernet, admin password).
# service env_file injects the same file into containers for DAG tasks
# (MYSQL_*, NOTION_API_KEY, …). Missing .env.airflow → clear Compose error.
#
# Analysis MySQL: join shared Docker network intl_analysis_net (created by
# docker-compose.mysql.yml). Do NOT rely on host.docker.internal → 127.0.0.1.
#   docker compose -f docker-compose.mysql.yml --env-file .env up -d
#   # or: docker network create intl_analysis_net
# MYSQL_HOST=mysql (network alias on that bridge). Host bind stays 127.0.0.1.
# ==============================================================================
x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.2-python3.11}
  # Required only for Airflow services — fail fast if the local secrets file is absent.
  env_file:
    - .env.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER in .env.airflow (cp .env.airflow.example .env.airflow)}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.airflow (cp .env.airflow.example .env.airflow)}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?Set AIRFLOW__CORE__FERNET_KEY in .env.airflow (cp .env.airflow.example .env.airflow)}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    PYTHONPATH: /opt/airflow:/opt/airflow/scripts
    OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-requests python-dotenv pyyaml pandas yfinance nltk feedparser beautifulsoup4 lxml pytrends mysql-connector-python}
    # Do NOT re-declare MYSQL_*/NOTION_* here with ${VAR:-}: empty Compose
    # interpolation would override values loaded from env_file into the container.
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./reports:/opt/airflow/reports
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
    - intl_analysis_net
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.airflow (cp .env.airflow.example .env.airflow)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.airflow (cp .env.airflow.example .env.airflow)}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - default

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:?Set _AIRFLOW_WWW_USER_PASSWORD in .env.airflow}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:

networks:
  # Shared with docker-compose.mysql.yml — MySQL stays on 127.0.0.1 for the host;
  # Airflow reaches it via the bridge DNS name `mysql` (no 0.0.0.0 publish).
  intl_analysis_net:
    name: intl_analysis_net
    external: true
