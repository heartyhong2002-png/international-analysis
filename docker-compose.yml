services:
  # ----------------------------------------------------------------------------
  # MySQL 8.0 데이터베이스 서비스
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: intl_analysis_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-jk614623!!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-international_analysis}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/db/create_views.sql:/docker-entrypoint-initdb.d/01_create_views.sql:ro
    networks:
      - intl_net

  # ----------------------------------------------------------------------------
  # (선택) 웹 기반 DB 관리 GUI 도구 (phpMyAdmin)
  # 웹 브라우저에서 http://localhost:8080 접속 시 MySQL DB를 GUI로 편하게 열람
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: intl_analysis_pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-root}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-jk614623!!}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - intl_net

volumes:
  mysql_data:
    name: intl_analysis_mysql_data

networks:
  intl_net:
    name: intl_analysis_net
