    lane: CONTEXT

  - source_id: br_agencia_brasil
    source_type: state_media_news
    source_role: secondary
    required: false
    fallback: []
    license_access_note: "Public Agência Brasil (EBC) RSS; Brazilian federal state news agency; official executive actions and economic/energy policies."
