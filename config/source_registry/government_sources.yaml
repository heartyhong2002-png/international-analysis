# Official / state channels for FAST + CONTEXT lanes.
# Packet A = US domestic policy signals (no election outcome prediction).
# Packet B = ally official channels (relationship_role: ally).
# Packet C (OFAC/BIS/competitor_adversary_axis) waits until A/B schema stabilizes.
# White House: dedicated optional collector; shared_schema official_raw_v1 + dedupe
# rules in COLLECTION_PIPELINE_ARCHITECTURE.md. Do not duplicate White House RSS
# into gov_announcements_collector.

