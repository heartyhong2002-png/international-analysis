name: Daily Light Collection

# Cloud light lane: RSS / public HTTP collectors only.
# No Ollama, MySQL, GDELT Cloud, or dashboard.
# Heavy collectors stay on the local PC pipeline.

on:
  schedule:
    # Daily 07:00 KST (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      with_kaggle:
        description: 'Also sync Kaggle datasets (needs KAGGLE_USERNAME / KAGGLE_KEY secrets)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  light-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Government announcements (RSS)
        continue-on-error: true
        run: python scripts/collection/gov_announcements_collector.py

      - name: White House official RSS
        continue-on-error: true
        run: python scripts/collection/fetch_whitehouse_official.py

      - name: Signal-gap triangulated RSS
        continue-on-error: true
        run: python scripts/collection/fetch_signal_gap_rss.py

      - name: Financial proxy indicators
        continue-on-error: true
        run: python scripts/collection/fetch_financial_proxy.py

      - name: Optional Kaggle sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_kaggle }}
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Kaggle secrets missing; skipping."
            exit 0
          fi
          python scripts/collection/fetch_kaggle_datasets.py

      - name: Commit collected artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/data/gov_announcements \
            data/whitehouse_official \
            data/signal_gap \
            data/sources/kayhan \
            || true

          if git diff --staged --quiet; then
            echo "No new or changed collection artifacts."
          else
            git commit -m "auto: daily light collection sync [skip ci]"
            git push
          fi
